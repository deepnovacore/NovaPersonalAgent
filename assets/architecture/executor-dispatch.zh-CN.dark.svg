    <line x1="670" y1="313" x2="718" y2="276" stroke="#2dd4bf" stroke-width="1.75" marker-end="url(#arrow-teal)"/>
  

    <rect x="720" y="104" width="160" height="104" rx="14" fill="#102624" stroke="#2dd4bf" stroke-width="1.5"/>
