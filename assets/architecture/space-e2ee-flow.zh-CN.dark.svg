<svg xmlns="http://www.w3.org/2000/svg" width="920" height="374" viewBox="0 0 920 374" role="img" aria-label="Space / Host / Client 配对与加密流程">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#7d8590"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#d29922"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <rect width="920" height="374" rx="20" fill="#0d1117"/>
  <g font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif'>
    
    <text x="40" y="44" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="start">Space / Host / Client 配对与加密流程</text>

    <rect x="40" y="72" width="230" height="44" rx="12" fill="#102624" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="155" y="99" font-size="14" font-weight="700" fill="#99f6e4" text-anchor="middle">Host（桌面 / 无头）</text>

    <rect x="345" y="72" width="230" height="44" rx="12" fill="#1e1930" stroke="#a371f7" stroke-width="1.5"/>
    <text x="460" y="99" font-size="14" font-weight="700" fill="#d2a8ff" text-anchor="middle">加密 Relay（零知识）</text>

    <rect x="650" y="72" width="230" height="44" rx="12" fill="#122136" stroke="#388bfd" stroke-width="1.5"/>
    <text x="765" y="99" font-size="14" font-weight="700" fill="#a5d6ff" text-anchor="middle">手机 Client（NovaCore）</text>

    <line x1="155" y1="116" x2="155" y2="346" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="460" y1="116" x2="460" y2="346" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="765" y1="116" x2="765" y2="346" stroke="#388bfd" stroke-width="1.5" stroke-dasharray="4 4"/>

    <line x1="155" y1="146" x2="456" y2="146" stroke="#7d8590" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="306" y="138" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">1. 注册 Space</text>

    <line x1="155" y1="186" x2="761" y2="186" stroke="#d29922" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
    <text x="460" y="178" font-size="12" font-weight="600" fill="#fde68a" text-anchor="middle">2. 扫码配对（一次性 QR）</text>

    <line x1="765" y1="226" x2="159" y2="226" stroke="#7d8590" stroke-width="1.75" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="460" y="218" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">3. 核对指纹并确认（首台 = Owner）</text>

    <line x1="155" y1="266" x2="456" y2="266" stroke="#2dd4bf" stroke-width="1.75" marker-end="url(#arrow-teal)"/>
    <line x1="460" y1="266" x2="761" y2="266" stroke="#2dd4bf" stroke-width="1.75" marker-end="url(#arrow-teal)"/>
    <text x="306" y="258" font-size="12" font-weight="600" fill="#99f6e4" text-anchor="middle">4. 下发内容密钥</text>
    <text x="612" y="258" font-size="12" font-weight="600" fill="#99f6e4" text-anchor="middle">密文转发</text>

    <line x1="765" y1="306" x2="159" y2="306" stroke="#7d8590" stroke-width="1.75" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="460" y="298" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">5. E2EE 实时对话 · 审批 · 离线意图同步</text>
  
  </g>
</svg>
