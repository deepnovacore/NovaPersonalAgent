    <line x1="374" y1="228" x2="402" y2="228" stroke="#2dd4bf" stroke-width="1.75" marker-end="url(#arrow-teal)"/>
    <rect x="404" y="210" width="124" height="36" rx="9" fill="#1c2128" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="466" y="233" font-size="12.5" font-weight="700" fill="#e6edf3" text-anchor="middle">LLM (+ Vision)</text>
    <line x1="528" y1="228" x2="556" y2="228" stroke="#2dd4bf" stroke-width="1.75" marker-end="url(#arrow-teal)"/>
