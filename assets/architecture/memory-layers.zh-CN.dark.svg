    <line x1="224" y1="146" x2="282" y2="186" stroke="#2dd4bf" stroke-width="1.75" marker-end="url(#arrow-teal)"/>
    <line x1="224" y1="248" x2="282" y2="268" stroke="#7d8590" stroke-width="1.75" marker-end="url(#arrow)"/>
    <line x1="614" y1="174" x2="672" y2="152" stroke="#a371f7" stroke-width="1.75" marker-end="url(#arrow)"/>
    <line x1="614" y1="202" x2="672" y2="244" stroke="#7d8590" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  
  </g>
