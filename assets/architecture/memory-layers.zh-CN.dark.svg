    <text x="132" y="266" font-size="12" font-weight="400" fill="#9ea7b3" text-anchor="middle">按需开启索引</text>

    <rect x="284" y="72" width="330" height="64" rx="12" fill="#1c2128" stroke="#484f58" stroke-width="1.5"/>
    <text x="304" y="100" font-size="14.5" font-weight="700" fill="#e6edf3" text-anchor="start">L0 运行时黑板</text>
    <text x="304" y="120" font-size="11.5" font-weight="400" fill="#9ea7b3" text-anchor="start">blackboard.sqlite · 7d / 1000 items / 8 MB</text>

    <rect x="284" y="150" width="330" height="74" rx="12" fill="#102624" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="304" y="180" font-size="14.5" font-weight="700" fill="#99f6e4" text-anchor="start">个人记忆权威账本</text>
    <text x="304" y="202" font-size="11.5" font-weight="400" fill="#e6edf3" text-anchor="start">workspace-graph.sqlite · 溯源 / 更正 / 遗忘</text>

    <rect x="284" y="238" width="330" height="62" rx="12" fill="#1c2128" stroke="#388bfd" stroke-width="1.5"/>
    <text x="304" y="266" font-size="14.5" font-weight="700" fill="#a5d6ff" text-anchor="start">文档知识库</text>
    <text x="304" y="286" font-size="11.5" font-weight="400" fill="#9ea7b3" text-anchor="start">knowledge.sqlite · FTS5 + Embeddings</text>

    <rect x="674" y="114" width="206" height="74" rx="12" fill="#1e1930" stroke="#a371f7" stroke-width="1.5"/>
    <text x="777" y="146" font-size="14" font-weight="700" fill="#d2a8ff" text-anchor="middle">mem0 / VoiceMem</text>
    <text x="777" y="168" font-size="12" font-weight="400" fill="#9ea7b3" text-anchor="middle">可选派生召回索引</text>

    <rect x="674" y="212" width="206" height="74" rx="12" fill="#21262d" stroke="#484f58" stroke-width="1.5" stroke-dasharray="5 4"/>
