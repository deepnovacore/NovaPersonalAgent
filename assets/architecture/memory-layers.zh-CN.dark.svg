<svg xmlns="http://www.w3.org/2000/svg" width="920" height="326" viewBox="0 0 920 326" role="img" aria-label="三层记忆与权限隔离">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#7d8590"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#d29922"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <rect width="920" height="326" rx="20" fill="#0d1117"/>
  <g font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif'>
    
    <text x="40" y="44" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="start">三层记忆与权限隔离</text>

    <rect x="40" y="84" width="184" height="96" rx="14" fill="#122136" stroke="#388bfd" stroke-width="1.5"/>
    <text x="132" y="126" font-size="14.5" font-weight="700" fill="#a5d6ff" text-anchor="middle">对话与授权信息源</text>
    <text x="132" y="148" font-size="12" font-weight="600" fill="#fde68a" text-anchor="middle">独立授权边界</text>

    <rect x="40" y="204" width="184" height="86" rx="14" fill="#21262d" stroke="#484f58" stroke-width="1.5"/>
