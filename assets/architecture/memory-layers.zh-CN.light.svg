    <text x="304" y="202" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="start">workspace-graph.sqlite · 溯源 / 更正 / 遗忘</text>

    <rect x="284" y="238" width="330" height="62" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
