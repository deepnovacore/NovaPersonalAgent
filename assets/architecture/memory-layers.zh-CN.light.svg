    <text x="132" y="266" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">按需开启索引</text>

    <rect x="284" y="72" width="330" height="64" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
