      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#14b8a6"/>
    </marker>
  </defs>
  <rect width="920" height="326" rx="20" fill="#ffffff"/>
  <g font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif'>
    
    <text x="40" y="44" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">三层记忆与权限隔离</text>

    <rect x="40" y="84" width="184" height="96" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
