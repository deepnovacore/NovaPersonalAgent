name: Website
# website's copy. Pages only deploys from main (environment policy), so a push
# here asks main's copy of this workflow to rebuild; that run checks out main at
# the root and this branch into website/. Pull requests build without deploying.
on:
  push:
    branches: [website]
  pull_request:
    branches: [website]

permissions:
  contents: read

env:
  NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  deploy-from-main:
    if: github.repository == 'deepnovacore/NovaPersonalAgent' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run website.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    if: github.repository == 'deepnovacore/NovaPersonalAgent' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: website
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check:links
