name: Website
# main's copy: rebuild when the docs or assets the site reads change, or when
# the website branch dispatches it.
on:
  push:
    branches: [main]
    paths: ['docs/en/**', 'docs/zh-CN/**', 'assets/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
  NEXT_TELEMETRY_DISABLED: '1'

# The site lives on the `website` branch but reads ../docs and ../assets from
# `main`, so the build checks out main at the root and the site into website/.
# The website branch carries a small copy that dispatches this workflow on push
# (the github-pages environment only deploys from main) and builds its PRs.
jobs:
  build:
    if: github.repository == 'deepnovacore/NovaPersonalAgent'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'website' }}
          path: website
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check:links
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/out
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
